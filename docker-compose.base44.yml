services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: seederlinux
      POSTGRES_USER: seeder
      POSTGRES_PASSWORD: seeder123
    volumes:
      - seederlinux-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeder -d seederlinux"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    image: postgres:16
    working_dir: /app
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: seederlinux
      PGUSER: seeder
      PGPASSWORD: seeder123
    volumes:
      - ./:/app:ro
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -ec 'psql -v ON_ERROR_STOP=1 -f install/schema.sql &&
      psql -v ON_ERROR_STOP=1 -f install/insert_core_scripts.sql'
    restart: "no"

  web:
    image: php:8.3-apache
    working_dir: /var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: seederlinux
      DB_USER: seeder
      DB_PASS: seeder123
    volumes:
      - ./:/var/www/html
    ports:
      - "3000:80"
    depends_on:
      db-init:
        condition: service_completed_successfully
    command: >-
      bash -ec '
      if ! php -m | grep -qx pdo_pgsql; then
        apt-get update &&
        apt-get install -y --no-install-recommends libpq-dev libcurl4-openssl-dev libpng-dev libjpeg62-turbo-dev libwebp-dev libfreetype6-dev xz-utils &&
        docker-php-ext-configure gd --with-freetype --with-jpeg --with-webp &&
        docker-php-ext-install -j$$(nproc) pdo_pgsql curl gd &&
        rm -rf /var/lib/apt/lists/*;
      fi;
      a2enmod rewrite headers;
      sed -ri "s/AllowOverride None/AllowOverride All/g" /etc/apache2/apache2.conf;
      chmod 755 /var/www/html;
      mkdir -p storage/logs storage/uploads assets/uploads;
      chown -R www-data:www-data storage assets/uploads;
      apache2-foreground'

volumes:
  seederlinux-postgres:
